# InventarioWMS — proxy reverso (HTTP). HTTPS/domínio: adicionar server 443 depois.
upstream inventariowms_gunicorn {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    client_body_timeout 120s;

    # Bloqueia exposição de arquivos sensíveis
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:env|git|sqlite3|py|ini|cfg)$ {
        deny all;
        return 404;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://inventariowms_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}
