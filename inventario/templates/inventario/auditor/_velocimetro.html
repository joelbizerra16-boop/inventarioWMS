{% load comparativo_tags l10n %}
<section class="aud-card aud-cartao aud-velocimetro" aria-labelledby="{{ id }}">
    <h2 class="aud-cartao-titulo" id="{{ id }}">{{ titulo }}
        <span class="aud-info" tabindex="0" role="note" title="{{ ind.subtitulo }}. Considera somente contagens liberadas; C3 dispensada quando C1 = C2." aria-label="Como é calculado: {{ ind.subtitulo }}. Considera somente contagens liberadas."><i class="bi bi-info-circle" aria-hidden="true"></i></span>
    </h2>
    {% if ind.suficiente %}
    <div class="aud-gauge-caixa">
        {% localize off %}
        <svg viewBox="0 0 200 106" class="aud-gauge" role="img" aria-label="{{ titulo }}: {{ ind.percentual|pct }} ({{ ind.numerador }} de {{ ind.denominador }} {{ unidade }})">
            <path d="M 16 96 A 84 84 0 0 1 184 96" class="aud-gauge-trilho"/>
            {% if ind.numerador %}<path d="M 16 96 A 84 84 0 0 1 184 96" class="aud-gauge-valor" pathLength="100" stroke-dasharray="{{ ind.percentual|pct_css }} 1000"/>{% endif %}
        </svg>
        {% endlocalize %}
        <div class="aud-gauge-numero">{{ ind.percentual|pct }}</div>
    </div>
    <p class="aud-gauge-base"><strong>{{ ind.numerador }}</strong> de <strong>{{ ind.denominador }}</strong> {{ unidade }}</p>
    {% else %}
    <div class="aud-gauge-vazio" role="status"><i class="bi bi-hourglass-split" aria-hidden="true"></i><strong>Sem dados suficientes</strong><span>{{ ind.motivo }}</span></div>
    {% endif %}
</section>
